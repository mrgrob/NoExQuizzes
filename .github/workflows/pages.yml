# Publishes the static site to GitHub Pages.
#
# This does NOT build or transform anything — there is no build step and no
# dependency install. It uploads the repository's static files exactly as they
# are (index.html at the root, plus the rounds/ JSON) and serves them.
#
# `configure-pages` with `enablement: true` turns Pages on the first time it
# runs, using GitHub's built-in GITHUB_TOKEN — no API key, no PAT, no secret,
# nothing to click in Settings. Consistent with the project's no-key rule.
name: Deploy to GitHub Pages

on:
  push:
    # The github-pages environment only accepts deploys from the repository's
    # DEFAULT branch. This repo's default branch is claude/noexquizzes-build-riy90x
    # (it was the first branch pushed), and that is where the quiz skills commit
    # new rounds — so deploys run from here. If you later make `main` the default
    # branch, change this to `main` (and Pages will then deploy from main).
    branches: [claude/noexquizzes-build-riy90x]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages (enables it on first run)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload the site (repo root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
